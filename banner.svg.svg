<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050c1a" />
      <stop offset="60%" stop-color="#0a192f" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    
    <linearGradient id="text-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#61dafb" />
      <stop offset="100%" stop-color="#00b4d8" />
    </linearGradient>
    
    <style>
      .title { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 700; fill: #ffffff; font-size: 42px; letter-spacing: 1px; }
      .subtitle { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 600; fill: url(#text-gradient); font-size: 20px; }
      .tech { font-family: monospace; font-weight: bold; fill: #58a6ff; font-size: 16px; letter-spacing: 2px; }
      
      /* Pure CSS Animation Layers */
      .line1 { animation: cycleLine1 9s infinite ease-in-out; }
      .line2 { animation: cycleLine2 9s infinite ease-in-out; opacity: 0; }
      .line3 { animation: cycleLine3 9s infinite ease-in-out; opacity: 0; }

      @keyframes cycleLine1 {
        0%, 28% { opacity: 1; transform: translateY(0px); }
        33%, 100% { opacity: 0; transform: translateY(-10px); }
      }
      @keyframes cycleLine2 {
        0%, 33% { opacity: 0; transform: translateY(10px); }
        38%, 66% { opacity: 1; transform: translateY(0px); }
        71%, 100% { opacity: 0; transform: translateY(-10px); }
      }
      @keyframes cycleLine3 {
        0%, 71% { opacity: 0; transform: translateY(10px); }
        76%, 95% { opacity: 1; transform: translateY(0px); }
        100% { opacity: 0; transform: translateY(-10px); }
      }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg-gradient)" rx="12" />

  <text x="50%" y="75" text-anchor="middle" class="title">Isha Kumari</text>

  <g class="line1">
    <text x="50%" y="125" text-anchor="middle" class="subtitle">🚀 Infrastructure Automation Enthusiast</text>
    <text x="50%" y="165" text-anchor="middle" class="tech">Linux | Docker | Core Infrastructure</text>
  </g>

  <g class="line2">
    <text x="50%" y="125" text-anchor="middle" class="subtitle">💻 Building Scalable Applications</text>
    <text x="50%" y="165" text-anchor="middle" class="tech">MongoDB | Express | React | Node.js</text>
  </g>

  <g class="line3">
    <text x="50%" y="125" text-anchor="middle" class="subtitle">🛡️ Clean Code Advocate & Tech Lead</text>
    <text x="50%" y="165" text-anchor="middle" class="tech">Git | DevOps | Cloud Systems</text>
  </g>
</svg>
